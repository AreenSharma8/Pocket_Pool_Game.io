<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>Pocket Pool</title>
<link rel="icon" type="image/webp" href="public/pocket-pool-logo.webp">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
    "cannon-es": "https://esm.sh/cannon-es@0.20.0",
    "socket.io-client": "https://esm.sh/socket.io-client@4.7.5"
  }
}
</script>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <!-- Shown only via CSS on touch devices held in portrait -- see the
         "rotate device" media query in style.css. Pool needs the width a
         landscape table gives it, so rather than trying to cram the table
         into a tall/narrow layout, we just ask for a rotation. -->
    <div id="rotate-overlay">
        <div class="rotate-icon">&#128241;</div>
        <p>Rotate your device to landscape<br>to play Pocket Pool</p>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
